services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: costdetective
      POSTGRES_PASSWORD: password
      POSTGRES_DB: costdetective
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costdetective"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://costdetective:password@db:5432/costdetective
      CORS_ORIGIN: http://localhost
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"   # optional: direct API access for debugging

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
